layout:
  qmk_keyboard: beekeeb/piantor
  layout_name: LAYOUT_split_3x6_3
layers:
  L0:
    - ["", "Q", "W", "E", "R", "T", "Y", "U", "I", "O", "P", ""]
    - [{t: "`", s: "~"}, {t: "A", h: "⌃"}, {t: "S", h: "⌥"}, {t: "D", h: "⇧"}, {t: "F", h: "❖"}, "G", "H", {t: "J", h: "❖"}, {t: "K", h: "⇧"}, {t: "L", h: "⌥"}, {t: ";", s: ":", h: "⌃"}, {t: "'", s: "\""}]
    - ["", "Z", "X", "C", "V", "B", "N", "M", {t: ",", s: "<"}, {t: ".", s: ">"}, {t: "/", s: "?"}, ""]
    - [{t: "ESC", h: "ALL"}, {t: "⇥", h: "L1"}, {t: "␣", h: "L2"}, {t: "⏎", h: "L2"}, {t: "⌦", h: "L1"}, {t: "⌫", h: "ALL"}]
  L1:
    - [null, "1", "2", "3", "4", "5", "6", "7", "8", "9", "0", null]
    - [null, {t: "", h: "⌃"}, {t: "←", h: "⌥"}, {t: "↑", h: "⇧"}, {t: "↓", h: "❖"}, "→", "←", {t: "↓", h: "❖"}, {t: "↑", h: "⇧"}, {t: "→", h: "⌥"}, {t: "", h: "⌃"}, null]
    - [null, null, "⇪", "⌫", "⌦", "⏎", "␣", "⇥", "ESC", "⇪", null, null]
    - [null, {type: "held"}, "L3", "L3", {type: "held"}, null]
  L2:
    - [null, "!", "@", "#", "$", "%", "^", "&", "*", "(", ")", null]
    - [null, {t: "", h: "⌃"}, {t: "", h: "⌥"}, {t: "", h: "⇧"}, {t: "", h: "❖"}, null, "-", {t: "+", h: "❖"}, {t: "{", h: "⇧"}, {t: "}", h: "⌥"}, {t: "|", h: "⌃"}, null]
    - [null, null, null, null, null, null, "_", "=", "[", "]", "\\", null]
    - [null, "L3", {type: "held"}, {type: "held"}, "L3", null]

combos:
  - {p: [37, 38], k: "L3", l: ["L0"]}
  - {p: [39, 40], k: "L3", l: ["L0"]}
